[package]
name = "emerge-mapper"
version = "0.1.0"
edition = "2024"
description = "A standalone world-building editor: author maps from an asset library, save what a game can load."

# **This is the application; `emerge-core` is the part with no engine in it.** The split is not
# decoration — `crates/emerge-core/tests/engine_free.rs` fails the build if anything in the core
# reaches for `bevy`, which is what lets the same schema, solvers and validation run in the game, in
# the headless search, and in here without the three agreeing on a renderer.
#
# `docs/2026-08-03-emerge-mapper-plan.md` is the design.
[dependencies]
emerge-core = { path = "../emerge-core" }
# The runtime half. The editor spawns pieces through `emerge_bevy::spawn_descriptor` rather than its
# own copy, so a map cannot look one way here and another in the game — the failure `bake.rs` and
# `site_editor::source_map` demonstrated by independently growing the same RON writer.
emerge-bevy = { path = "../emerge-bevy" }
# The game's own pose blender. The bench previews through THIS rather than a copy, on the same
# argument `emerge-bevy` makes for `spawn_descriptor`: a rig cannot move one way here and another in
# the game if there is only one blender.
emerge-anim = { path = "../emerge-anim" }
# The editor is a Bevy app in its own right, not a mode of the game. `sim_harness.rs` is the precedent
# the plan cites for two binaries over one plugin graph — "not a second code path".
# `bevy_dev_tools` is what carries `infinite_grid` — verified in the vendored source at
# `bevy_dev_tools-0.19.0/src/infinite_grid.rs`, reached as `bevy::dev_tools::infinite_grid`.
# `jpeg` because the shipped kits embed PBR textures as JPEG and Bevy's defaults cover only PNG.
bevy = { workspace = true, features = ["jpeg", "bevy_dev_tools"] }
ron.workspace = true
serde.workspace = true
# The VLM labeler's transport (`vlm.rs`): one blocking OpenAI-style POST, made from a task-pool
# thread, never the UI thread. The editor is dev-only tooling, so a network client here does not
# leak toward the game — the game keeps zero HTTP deps (`docs/llm_rule_authoring.md`: the LLM
# authors metadata, it never runs in the sim).
ureq = { version = "3", features = ["json"] }
serde_json.workspace = true
# Base64 data-URI image parts for the chat request; `image` encodes the booth's RGBA readback to
# PNG. Both already in the build graph (serde_json via emerge-core, base64/image via bevy).
base64 = "0.22"
image.workspace = true
# Cmd+C on the detail pane — the pane's text into the system clipboard, so an author can hand a
# piece's facts to an agent. Text only; the image-data feature would drag image deps in twice.
arboard = { version = "3", default-features = false }

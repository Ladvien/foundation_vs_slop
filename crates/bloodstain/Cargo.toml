[package]
name = "bloodstain"
version = "0.1.0"
edition = "2024"
description = "Blood as a material: Carreau-Yasuda rheology with a Casson yield stress, percolation spatter, procedural stain morphology, the forensic pattern taxonomy, and the drying timeline. Engine-free, no_std, deterministic."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ladvien/bloodstain"
keywords = ["gamedev", "blood", "forensics", "rheology", "gore"]
categories = ["game-development", "simulation"]
# **Published, unlike most of this workspace's mirrored crates, and it is not a preference.**
#
# `bevy_carnage` is on crates.io and depends on this crate; a released package may not depend on a
# path-only dependency, so `bevy_carnage 0.2.0` cannot ship at all unless this one does. The
# `version` *and* `path` on that dependency is the same rule from the other side.
publish = true

# **No math library, and that is a boundary rather than an omission.** The public API is `[f32; 3]`,
# exactly as `isomesh` does and for the same reason: the workspace this was carved out of resolves TWO
# `glam` versions, and a leaf that names neither cannot collide with either. Conversion at a consumer's
# boundary is per-wound, not per-vertex, so the cost is a struct copy per event.
#
# `libm` rather than `std`'s math, unconditionally, because a second math path is a second set of bits.
# Measured before it was adopted: at the frozen spatter golden's own inputs, `libm`'s `sinf`, `cosf` and
# `sqrtf` are BIT-IDENTICAL to the platform libm this model was blessed against, so the move costs
# nothing the golden can see. `powf` and `expf` differ by one ULP at some inputs and are read only by
# code written here, never by a moved golden.
[dependencies]
libm = "0.2"
serde = { workspace = true, optional = true }

[features]
default = ["serde"]
serde = ["dep:serde"]

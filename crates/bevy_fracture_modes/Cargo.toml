[package]
name = "bevy_fracture_modes"
version = "0.1.0"
edition = "2024"
description = "Fracture modes on a convex decomposition for Bevy: precompute the sparse, mass-orthonormal fracture modes of a cell graph at bake time, then project an impact onto them at runtime so a body breaks across its real weaknesses — Sellán et al. 2022, deterministic."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ladvien/bevy_fracture_modes"
keywords = ["bevy", "gamedev", "fracture", "destruction", "gore"]
categories = ["game-development", "graphics"]
# **Published**, because `bevy_carnage` is on crates.io and depends on this crate, and a released
# package may not depend on a path-only dependency. Same rule as `bevy_wetmap`.
publish = true
exclude = ["docs/*.gif"]

[dependencies]
# **The umbrella with everything off but `std`.** This crate is a graph, a dense solver and two
# resources: `bevy::app`, `bevy::ecs` and `bevy::math` are all it names, and all three are in the
# umbrella's core. No asset, no image, no mesh, no material — a fracture mode is a number per cell,
# and the crate that owns the cells draws them.
bevy = { version = "0.19.0", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]

# **Examples only.** The windowed example needs winit and the 3D render pipeline, so it takes the
# full umbrella here, where it cannot reach a consumer's dependency graph. `tests/leaf.rs` reads
# `[dependencies]` only, deliberately.
[dev-dependencies]
bevy = { version = "0.19.0" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
bevy = { version = "0.19", default-features = false, features = ["web", "webgpu"] }

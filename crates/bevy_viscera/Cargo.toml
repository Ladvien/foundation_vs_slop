[package]
name = "bevy_viscera"
version = "0.1.0"
edition = "2024"
description = "Deterministic XPBD Cosserat-style viscera for Bevy: strands that spill, coil and tether, a mesenteric membrane that tears monotonically, and a CPU tube mesh handed back to the caller."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ladvien/bevy_viscera"
keywords = ["bevy", "gamedev", "physics", "xpbd", "gore"]
categories = ["game-development", "simulation"]
# **Published, unlike most of this workspace's mirrored crates, and it is not a preference.**
#
# `bevy_carnage` is on crates.io and depends on this crate; a released package may not depend on a
# path-only dependency, so `bevy_carnage 0.2.0` cannot ship at all unless this one does. The
# `version` *and* `path` on that dependency is the same rule from the other side.
publish = true

# **The umbrella with defaults off**, matching `bevy_carnage`'s precedent in the parent workspace. The
# solver is plain arithmetic over `Vec3`; the only Bevy surface it genuinely needs is the `Mesh` type it
# hands back, the asset-usage flags that `Mesh` is constructed with, the ECS/app to be a plugin at all,
# and `log` for the loud refusals that are this crate's answer to bad input. `bevy::app`, `bevy::ecs`,
# `bevy::math` and `bevy::transform` are re-exported by `bevy_internal` unconditionally, so they need no
# feature named here — checked in `bevy_internal-0.19.0/src/lib.rs:25-67`, not assumed.
[dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
    "bevy_asset", # RenderAssetUsages — `Mesh::new` takes it
    "bevy_mesh",  # Mesh, Indices, PrimitiveTopology, the ATTRIBUTE_* constants
    "bevy_log",   # warn! — a degenerate direction or an over-long strand has to be visible
    "std",
] }

# **Examples only.** The crate's own `bevy` above is trimmed to what a solver and a mesh builder need.
# `examples/spill.rs` additionally wants a window, an event loop, the 3D forward pipeline, gizmo lines
# for the tethers and a UI legend, so it takes the `3d` + `ui` feature groups here, where they cannot
# reach a consumer's dependency graph. That pair is Bevy's own `default` minus `2d` and `audio`; the two
# groups expand to the whole windowed stack (`bevy_winit`, `bevy_window`, `bevy_render`,
# `bevy_core_pipeline`, `bevy_pbr`, `bevy_gizmos_render`, `bevy_ui_render`, `default_font`, `x11`,
# `wayland`, `std`, …) — expanded from `bevy-0.19.0/Cargo.toml`, not guessed. `tests/leaf.rs` reads
# `[dependencies]` only, deliberately.
[dev-dependencies]
bevy = { version = "0.19.0", default-features = false, features = ["3d", "ui"] }

# `rod_determinism` is a terminal program: no window, no `App`, no GPU. It is the example that proves the
# crate's product, so it must be runnable on a machine that cannot open a window at all.
[[example]]
name = "rod_determinism"
path = "examples/rod_determinism.rs"

[[example]]
name = "spill"
path = "examples/spill.rs"

# **The wasm demos' extra features.** Target-gated, so a native build resolves none of it.
#
# `web` is REQUIRED and not optional polish: without it `std::time::Instant::now()` compiles for
# `wasm32-unknown-unknown` and then PANICS in the browser, because there is no such clock there.
# `webgpu` takes precedence over the `webgl2` that Bevy's defaults always pull in
# (`bevy_render-0.19.0/src/settings.rs` selects `Backends::BROWSER_WEBGPU` on wasm when both are on),
# so these modules are WebGPU-only and `web/play.html` gates on an adapter before importing them.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
bevy = { version = "0.19", default-features = false, features = ["web", "webgpu"] }

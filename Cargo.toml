# The game is the workspace root package; the engine-free half lives in `crates/`. See
# `docs/2026-08-03-emerge-mapper-plan.md` for why the split exists and what may cross the boundary.
[workspace]
members = [
    "crates/det_rng",
    # The Boolean satisfiability back-end `emerge-core::constraints` delegates to. Its own crate
    # because it is the one part of the constraint stack likely to be REPLACED — clauses in, bits out,
    # knowing nothing about grids or prototypes — and isolating a replaceable component behind a
    # boundary is cheaper before it is written than after.
    "crates/deterministic_solver",
    "crates/emerge-core", "crates/emerge-anim", "crates/emerge-bevy", "crates/emerge-mapper",
    "crates/fvs",
    "crates/bevy_orca", "crates/map_elites", "crates/bevy_devshot",
    "crates/bevy_stigmergy", "crates/bevy_light_grid", "crates/bevy_speech_bubbles",
    # The agent debugger, vendored whole so it can be USED and EVOLVED here rather than pinned to a
    # rev of someone else's history. Two members because the repo has two independent halves: the MCP
    # server binary (a separate process, speaks MCP to an agent and BRP to the game) and the companion
    # Bevy plugin the game actually links. Both are listed so `cargo test --workspace` covers them —
    # a crate outside that walk is how `emerge-anim`'s 21 tests once sat outside the gate.
    "crates/bevy_debugger_mcp",
    "crates/bevy_debugger_mcp/crates/bevy_debugger_bevy",
]
# Stated rather than inherited. The root package is edition 2024, so "3" is already what Cargo picks —
# writing it down means a future edition bump cannot move the resolver as a side effect, and it says
# which rules the feature unification below is playing by.
resolver = "3"

# **One version per dependency, for the whole workspace.** Its job is version pinning, not feature
# policy: a member that needs different FEATURES still declares them (`features = [...]` alongside
# `workspace = true`), and a member that needs `default-features = false` declares the dep outright and
# says why — Cargo ignores a member-level `default-features = true` over a workspace `false`, so there
# is no way to express both here, and a silently-ignored key is worse than an honest exception.
#
# Every version below is the one already resolved in `Cargo.lock`; introducing this table moved nothing.
[workspace.dependencies]
bevy = { version = "0.19.0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
ron = "0.12.2"
rand = "0.10"
rand_chacha = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }

[package]
name = "foundation_vs_slop"
version = "0.1.0"
edition = "2024"
# Two binaries exist (the game and the offline `train` driver), so a bare `cargo run` is ambiguous.
# Default it to the game, so `cargo run` (and `FVS_RESEARCH_ROOM=1 cargo run`) launch it directly.
default-run = "foundation_vs_slop"

[features]
# Opt-in test/replay scaffolding: gates the headless `sim_harness`, the deterministic snapshot/hash
# accessors, and any test-only visual-decoupling hooks. Off by default so the shipped binary carries
# none of it. Enable with `cargo test --features test-harness`.
#
# It also forwards `bevy_autogib/strict-order`. That crate's vertex-soup sort carries the same
# runtime tie check `util::sort_total_by_key_at` does, and the check is `debug_assertions`-gated — so
# without this line a harness run built in release would silently drop the one assertion standing
# between the fracture bake and a load-order-dependent soup. Same reason the game's own copy keys off
# this feature.
test-harness = ["bevy/debug", "dep:clap", "dep:indicatif", "dep:libc", "bevy_autogib/strict-order"]
# **Agent debugging over BRP** (`cargo run --features debugger`). Turns on Bevy's own Remote Protocol so
# `bevy_debugger_mcp` — our MCP server, a separate process — can query entities, components and resources
# in the running game. See `docs/bevy_debugger_mcp.md`.
#
# **Opt-in, not default, and that is the point.** BRP is a remote-control channel into a live `World`: it
# can read and MUTATE anything. It has no place in a shipped binary, and it must never be on during a
# determinism run, where an external writer into pinned state is precisely the thing the goldens exist to
# catch. Gating it as a feature keeps the default and `--release` builds byte-identical to today —
# measured: with this off, the resolved feature set is unchanged.
debugger = ["bevy/bevy_remote", "dep:bevy_debugger_bevy"]

# Both binaries are declared explicitly. `src/bin/train.rs` would otherwise be auto-discovered and
# compiled on a plain `cargo check`, where `sim_harness` does not exist — `required-features` is the
# only way to say "this target needs test-harness". Declaring one [[bin]] means declaring them all.
[[bin]]
name = "foundation_vs_slop"
path = "src/main.rs"

[[bin]]
name = "train"
path = "src/bin/train.rs"
required-features = ["test-harness"]

[dependencies]
# The engine-free world-building core: constraint IR, solvers, WFC, geometry, seeded RNG. Re-exported
# at its old paths by `lib.rs` and `placement/mod.rs`, so `crate::rng` / `crate::placement::ir` still
# resolve everywhere they did before the split.
emerge-core = { path = "crates/emerge-core" }
# The runtime half of emerge: turns a library and a map into entities. `src/emerge_map.rs` uses it to
# load what `emerge-mapper` writes, which is the step that makes the editor's output real.
emerge-bevy = { path = "crates/emerge-bevy" }
# The pose blender. Its own crate so `emerge-mapper` can drive the real one — see that manifest.
emerge-anim = { path = "crates/emerge-anim" }
# ORCA local avoidance. Nothing in it is about this game — it is a 2-D linear program over discs — so
# it is a crate anyone can use. Re-exported at `crate::orca`, so every call site is unchanged.
bevy_orca = { path = "crates/bevy_orca" }
# The Quality-Diversity kernel: the MAP-Elites archive, the emitter loops, sep-CMA-ES and POET. It has
# no evaluator — every loop takes the mutation and the evaluation as closures — which is exactly what
# lets it leave the game. Re-exported at the old `squad_ai::{qd, map_elites, cmaes, poet, …}` paths.
map_elites = { path = "crates/map_elites" }
# The sentinel-file screenshot tool. Its own crate so the editor stops carrying a byte-for-byte copy
# of the same capture rig — one screenshot path, in one place.
bevy_devshot = { path = "crates/bevy_devshot" }
# The stigmergy substrate — N scalar influence channels plus the vectorial rally pheromone, in cell
# space. `ai::field` is the facade that gives it the dungeon's world<->cell mapping back.
bevy_stigmergy = { path = "crates/bevy_stigmergy" }
# The CPU illuminance grid creatures read (NOT a renderer — the GPU never sees it). `light.rs` is the
# facade that hands it the dungeon's world<->cell mapping and `line_of_sight`.
bevy_light_grid = { path = "crates/bevy_light_grid" }
# World-space speech/thought balloons: the CPU text raster and the billboard. The font path stays in
# `dialogue::bubble`, because that is the one thing a library must not assume.
bevy_speech_bubbles = { path = "crates/bevy_speech_bubbles" }
# Runtime mesh fracture: the slicer, the watertight caps, and the bake-once-per-source cache. It hands
# out a centre and a half-extent per fragment and stops there — `gore::spawn_fragments` is the facade
# that turns those into avian bodies, and `autogib.rs` is the one that knows VALKYRIE carries a rifle.
#
# **A git dependency, not a workspace member, and the direction of that arrow is the point.** This crate
# used to live at `crates/bevy_autogib` with a read-only `subtree split` mirror published from it. That
# was backwards in a way that cost real time: a `subtree split` carries only *commits*, so the crate's
# own audit harness — which sat uncommitted in this working tree — could never reach the published
# repository, and an agent reading the published manifest reported our dependency list wrong. It was
# reading the truth about what we had published.
#
# `Ladvien/bevy_autogib` is now the source of truth and this is an ordinary consumer of it. Pinned to a
# rev for the same reason autogib pins `isomesh`: an unpinned dependency whose slicer moved between
# builds would move the game's gib geometry between builds.
#
# The `test-harness` feature above forwards `bevy_autogib/strict-order`; a git dependency forwards
# features exactly as a path dependency does, and that forward is what keeps the vertex-soup tie check
# alive in a release-built harness.
#
# **Bumped ba3b13b → 0cfee6e at the 2026-08-17 merge**, which is where the arrow's direction stops
# being theoretical. `main` had meanwhile pulled the crate's AG-017..AG-023 line back INTO
# `crates/bevy_autogib` and fixed it to pass this repo's gates; that vendored copy is gone again and
# the same work arrives the way every other dependency's does — by moving the pin. What the bump
# carries: the region-query hit model (AG-017), the fragment-adjacency match (AG-016), one bake
# across granularities (AG-015), the halving and sub-pixel-face fixes (AG-018/19), and the demo,
# recordings and on-screen controls (AG-020..023).
#
# **Bumped 0cfee6e → 007c6ca**, and this is the first bump taken the way the reversed arrow intends:
# the work was done in `Ladvien/bevy_autogib`, verified there against its own lockfile, pushed there,
# and arrives here as a rev. Nothing was vendored and nothing was mirrored back. What the bump
# carries: AG-021 (the `isomesh` pin moved to `aa82b0b`, zero re-blessed numbers) and AG-022 (bullet
# holes — a `Bore` subtracted from the proxy as plane cuts only, so a channel is real geometry with a
# red interior and every shard is still a convex-hull collider).
#
# **`CutSettings` gained a `bores` field and `FractureSettings::cut_for` gained a parameter.** Neither
# reaches this game: it constructs no `CutSettings` and never calls `cut_for` — it uses
# `FractureSettings` (unchanged), `FractureCache`, `FractureSubject`, `DetachedPart` and the plugin.
# Checked rather than assumed, because a signature change in a pinned dependency is exactly the thing
# a pin exists to make visible.
bevy_autogib = { git = "https://github.com/Ladvien/bevy_autogib", rev = "007c6ca" }
# The agent debugger's companion Bevy plugin — custom BRP methods for screenshots and headless input
# injection. **Optional, pulled in only by the `debugger` feature**, so it is absent from the resolved
# dependency graph of every default, release and determinism build.
#
# A path dep into the vendored debugger, NOT a pinned git rev. The pin bought reproducibility at the
# cost of being unable to fix the thing: a bug found while driving the game (`bevy_debugger/input`
# reported success and moved nothing) could only be repaired by editing another repo, cutting a rev and
# bumping. The debugger now lives at `crates/bevy_debugger_mcp/` under the same monorepo → mirror flow
# as the other ten crates, so a fix is an ordinary edit here.
bevy_debugger_bevy = { path = "crates/bevy_debugger_mcp/crates/bevy_debugger_bevy", optional = true }
avian3d = "0.7.0"
# `jpeg`: the SCP_Characters glTFs (e.g. VALKYRIE, the squad body) embed their PBR textures as JPEG to
# keep the .glb small; Bevy's default image features cover PNG but NOT JPEG, so without this the whole
# `characters/*.glb` fails to load ("invalid image mime type: image/jpeg") and the unit renders as nothing.
bevy = { workspace = true, features = ["jpeg"] }
ron.workspace = true
# Bit-exact binary framing for the offline search's worker IPC (`squad_ai::parallel`). RON's shortest-
# decimal `f32` text is NOT a guaranteed bit-identical round-trip across platforms; that 1-ULP perturbation
# flipped the `>=` elitism and the descriptor `cell()` bin, so the parallel archive diverged from the
# inline one on x86 while matching on ARM (issue #44). bincode writes `f32` as its 4 raw IEEE-754 bytes
# (fixed endianness), so genomes and scores cross the process boundary byte-for-byte.
bincode = "1.3"
# CPU glyph rasterization for world-space dialogue bubbles (see `dialogue`): Bevy 0.19's text stack
# (parley/swash) has no public "rasterize a string to a standalone Image" API, and there is no 2D
# camera to host `Text2d`, so bubbles bake their text into an RGBA image sampled on a billboarded 3D
# quad. `ab_glyph` is pure-Rust, no system deps. Green, "Improved Alpha-Tested Magnification for
# Vector Textures" (SIGGRAPH 2007) is the SDF alternative; CPU raster-on-change is the simpler one path.
ab_glyph = "0.2"
serde.workspace = true
# Placement grammar (see slop/research/2026-07-05-placement-grammar-implementation.md):
# one reproducible RNG family across the solver stack. rand + rand_chacha resolve to a single rand_core
# 0.10 in the tree. rayon parallelises per-region-independent MCMC (Stage 3).
rand.workspace = true
rand_chacha.workspace = true
rayon = "1"
# CLI + progress for the offline `train` tuning driver ONLY — optional, pulled in by `test-harness` so the
# shipped game binary carries neither. `clap` derives the subcommand parser; `indicatif` renders the live
# per-generation progress bar (ETA + stats) and the multi-bar island display.
clap = { version = "4", features = ["derive"], optional = true }
indicatif = { version = "0.17", optional = true }
# Linux `prctl(PR_SET_PDEATHSIG)` so the offline `train` search's island/worker child PROCESSES are killed by
# the kernel the instant the driver dies — for any reason, including a signal that skips Rust destructors.
# Without it a Ctrl+C/kill orphaned the 24 island workers and pegged the box (they outlived their driver).
# `train`-only: pulled in by `test-harness`, never in the shipped game binary. Already resolved in Cargo.lock
# (transitive via bevy), so this adds no new download.
libc = { version = "0.2", optional = true }

# Test-only. `image` (PNG decode) backs the windowed SSIM visual-regression capture test
# (`tests/visual_capture.rs`, 2026-07-19 review Finding F). Pinned to the version Bevy already resolves
# (0.25.x), PNG-only, so it adds no new download and no new crate to the shipped binary.
[dev-dependencies]
image.workspace = true
# For `tests/valkyrie_asset.rs`, which reads the glb's JSON chunk to pin the clip-index / gait-duration /
# bone-name contracts `src/squad.rs` bakes in. Already in the tree via `bevy_gltf`, so it costs no build time.
serde_json.workspace = true

# Bevy's recommended dev compile-speed profile: keep our own crate light so
# iteration is fast, but optimize dependencies so the engine runs at speed.
[profile.dev]
opt-level = 1
# Debug info is ~84% of a default Bevy debug build (bevyengine/bevy#21938: 803 MB of 961 MB).
# `line-tables-only` keeps filename/line in panic backtraces while dropping type/variable info.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
# Dependencies dominate target/, and we never step through Bevy internals.
debug = false

# Package overrides above do not reach build scripts or proc macros; those need build-override.
[profile.dev.build-override]
debug = false

# Shipping/runtime profile. Bevy's recommended release settings: whole-program `thin` LTO plus a single
# codegen unit trade longer link time for faster generated code across the whole 58k-LOC crate (the game
# and the `--release` `train` driver both use this). These flags change scheduling/inlining only — they do
# NOT alter IEEE-754 results (rustc never reassociates floats or contracts FMA without `-ffast-math`), so
# the exact-hash determinism goldens are unaffected. Verified by running the determinism suite in release.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Final-distribution profile: `fat` LTO squeezes a bit more at the cost of even longer link time. Use for
# shipped builds (`cargo build --profile dist`); day-to-day and training stay on `release`.
[profile.dist]
inherits = "release"
lto = "fat"
